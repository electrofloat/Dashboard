# Default authorization is always 'deny'
# So if 'authelia_url' is not set and also no allow/deny criteria are set then everything will be denied
# 'deny' and 'allow' are mutually exclusive. With these you can explicitly 'allow'/'deny' users.
# if 'authelia_url' is set it will be consulted for authorization. If also 'allow' or 'deny' are set Authelia will only be consulted
# if those rules are not matched already.

# Optional
# Contains global configurations
app_config:
  # Optional
  # Title of the browser tab, default is Dashboard.
  #title: Dashboard

  # Optional
  # Url to your Authelia instance
  # The user's Authelia session cookie is sent to this url, so only use http:// for a host on an internal network
  authelia_url: https://auth.example.org

  # Optional
  # Timeout to wait for authelia's answer (in seconds), default is 5.
  #authelia_timeout: 5

  # Optional
  # Name of Authelia's session cookie, default is authelia_session.
  #authelia_cookie_name: authelia_session

  # Optional
  # Seconds to remember Authelia's answer for a session and url, default is 30. 0 disables the cache.
  #authelia_cache_ttl: 30

  # Optional
  # Seconds to skip Authelia checks after it failed or timed out, default is 10. 0 disables it.
  # Tiles that need Authelia are hidden during this time, the others are shown right away.
  #authelia_backoff: 10

  # Optional
  # Number of tiles checked against Authelia at the same time, default is 1.
  # Higher values can be slower with some Authelia setups.
  #authelia_parallel_checks: 1

  # Optional
  # The addresses of your reverse proxies (CIDR form). If set, the Remote-User, Remote-Groups and X-Forwarded-For
  # headers are only accepted from these addresses, requests from anywhere else are treated as anonymous.
  # If not set, these headers are accepted from anyone, so the dashboard must only be reachable through the proxy.
  #trusted_proxies:
  #  - '172.16.0.0/12'

  # Optional
  # Can be either:
  #   - a filename: it will be loaded from user-data/backgrounds/filename
  #   - a url
  #background: background.jpg

  # Optional
  # The subject(s) that can access the settings page. Uses Authelia's user:, group: subject form (https://www.authelia.com/configuration/security/access-control/#subject)
  # For now this is not really a settings page but a template for a tile to check how it would look like on the main page with the given texts, icon and color
  settings:
    - 'user:testuser'
# Optional
# Definitions of networks that can be used to narrow the allow/deny criteria. Uses Authelia's network definitions form (https://www.authelia.com/configuration/definitions/network/)
network:
  internal:
    - '10.0.0.0/24'

# Mandatory
# At least 1 type: tile or 1 type: folder is required
tiles:
  - type: tile
    # Mandatory
    # The title of the tile
    title: Zigbee2MQTT
    # Optional
    # Description appears on the second line of the tile
    description: Zigbee configurator
    # Optional
    # The icon of the tile
    # Can be either:
    #   - a filename: it will be loaded from user-data/icons/filename
    #   - a string starting with 'di-' an icon from https://dashboardicons.com/
    icon: di-zigbee2mqtt
    # Optional
    # The background color of the tile
    background: "#f80"
    # Mandatory
    # The url of the hosted app. This url will be checked with Authelia for authorization (if authelia_url is set)
    url: https://zigbee2mqtt.example.org
    # Optional
    # This is either 'allow' or 'deny', they are mutually exclusive
    # The subject(s) that will be allowed/denied access. Uses Authelia's user:, group: subject form (https://www.authelia.com/configuration/security/access-control/#subject)
    allow: ["user:testuser"]
    # Optional
    # Can only be used with 'allow'/'deny'
    # If given, it will only allow/deny access from the given network. Uses Authelia's networks form (https://www.authelia.com/configuration/security/access-control/#networks)
    networks:
      - internal
  - type: tile
    title: Grafana
    description: Interactive visualization platform
    icon: https://icon
    url: https://grafana.example.org
    deny:
      - "user:testuser1"
      - 'group:blacklist'
    networks:
      - internal
      - '172.16.0.0/24'
  - type: folder
    title: HomeAssistant
    # Optional
    # Fixed id for the folder's url (/folder/<id>/), so the url stays the same when tiles are reordered or renamed.
    # Only letters, digits, '-' and '_'.
    #id: homeassistant
    icon: di-home-assistant
    tiles:
    - type: tile
      title: HomeAssistant
      description: Home automation platform
      icon: di-home-assistant
      background: "#05a"
      url: https://homeassistant.example.org
      allow: ["user:testuser"]
    - type: tile
      title: Zwavejs2UI
      description: Z-Wave to MQTT
      icon: di-zwavejs2mqtt
      background: "#08f"
      url: https://zwavejsui.example.org
      allow: ["user:testuser2"]
  - type: tile
    title: Healthchecks
    description: Instant alerts for silently failing jobs
    icon: di-healthchecks
    background: "#fafbfc"
    url: https://healthchecks.example.org
    allow:
      - "user:testuser"
      - ["group:admins", "group:realadmins"]
  - type: tile
    title: Immich
    description: Photo and video backup/storage
    icon: di-immich
    url: https://immich.example.org
    allow: ["user:testuser"]
  - type: tile
    title: Linkding
    description: Bookmarks storage
    icon: di-linkding
    background: "#192865"
    url: https://linkding.example.org
    allow: ["user:testuser"]
  - type: tile
    title: PaperlessNgx
    description: Document management system
    icon: di-paperless-ngx
    url: https://paperlessngx.example.org
    allow: ["user:testuser"]
  - type: tile
    title: Plex
    description: Personal media management
    icon: di-plex
    background: "#520"
    url: https://plex.example.org
    allow: ["user:testuser"]
  - type: tile
    title: Portainer
    description: Docker container management system
    icon: di-portainer
    url: https://portainer.example.org
    allow: ["user:testuser"]
  - type: tile
    title: Wiki.js
    icon: di-wikijs
    background: "#fafbfc"
    url: https://wikijs.example.org
    allow: ["user:testuser"]
