{% extends "base.html" %}
{% import "icons.html" as icons %}
{% block scripts %}
<script src="{{ url_for('static', filename='color.js') }}" defer></script>
{% endblock %}
{% block content %}

<section class="hero is-link is-fullheight">
  <div class="hero-body" style="background-image: url({{ config.appconfig.background_img|versioned|css_string }}) ;
        background-position: center center;
        background-repeat:  no-repeat;
        background-attachment: fixed;
        background-size:  cover;
        background-color: #999;">
  <a class="button" style="position: absolute; top: 00px; right: 0px;" href="{{ url_for('main.index') }}" aria-label="Home" title="Home">
    <span class="icon is-small">
      {{ icons.house() }}
    </span>
  </a>
  <div class="container">
    <div class="columns is-vcentered">
        <div class="column">
          <section class="item-container tag-0-dash">
                <div id="background" class="item" style="background-color: #161b1f">
                    <div class="app-icon-container">
                                                        <img id="icon" class="app-icon" src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/linux.png">
                                                    </div>
                    <div class="details">
                        <div id="title" class="titl white">ExampleTitle</div>
                        <div id="description" class="desc white">Example Description</div>
                    </div>
                    <a rel="noopener noreferrer" id="link" class="link white" target="_blank" href="https://localhost">
                      <svg class="svg-inline--fa fa-arrow-alt-to-right fa-w-14" aria-hidden="true" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                        <path fill="currentColor" d="M448 88v336c0 13.3-10.7 24-24 24h-24c-13.3 0-24-10.7-24-24V88c0-13.3 10.7-24 24-24h24c13.3 0 24 10.7 24 24zM24 320h136v87.7c0 17.8 21.5 26.7 34.1 14.1l152.2-152.2c7.5-7.5 7.5-19.8 0-27.3L194.1 90.1c-12.6-12.6-34.1-3.7-34.1 14.1V192H24c-13.3 0-24 10.7-24 24v80c0 13.3 10.7 24 24 24z">
                        </path>
                      </svg>
                    </a>
                </div>
          </section>
        </div>

        <div class="column is-two-thirds">
          <div class="box">
            <div class="field">
              <label class="label">Title</label>
              <div class="control">
                <input id="title_input" class="input" type="text" placeholder="ExampleTitle" value="ExampleTitle"/>
              </div>
              </div>
              <div class="field">
                <label class="label">Description</label>
                <div class="control">
                  <input id="description_input" class="input" type="text" placeholder="Example Description" value="Example Description" />
                </div>
              </div>
              <div class="field">
                <label class="label">Icon src</label>
                <div class="control">
                  <input id="icon_input" class="input" type="text" placeholder="di-linux" value="di-linux" />
                </div>
              </div>
              <div class="field">
                <label class="label">Url</label>
                <div class="control">
                  <input id="url_input" class="input" type="url" placeholder="https://app.example.org" />
                </div>
              </div>
              <label for="color-picker">Color:</label>
              <input type="color" value="#161b1f" id="color-picker" />
              Value: <span id="value">#161b1f</span>
              <div class="field mt-4">
                <label class="label">Config</label>
                <pre id="yaml" class="yaml"></pre>
              </div>
              <button id="copy" class="button is-small" type="button">Copy</button>
              <span id="copy-status" class="ml-2" role="status"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
