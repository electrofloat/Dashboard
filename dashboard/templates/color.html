{% extends "base.html" %}
{% block content %}
<script>
let colorPicker;
const defaultColor = "#161b1f";

window.addEventListener("load", startup, false);

function startup() {
  colorPicker = document.querySelector("#color-picker");
  colorPicker.value = defaultColor;
  colorPicker.addEventListener("input", updateFirst, false);
  //colorPicker.addEventListener("change", updateAll, false);
  colorPicker.select();

  title_input = document.querySelector("#title_input");
  title_input.addEventListener("input", titleupdate, false);

  description_input = document.querySelector("#description_input");
  description_input.addEventListener("input", descriptionupdate, false);

  icon_input = document.querySelector("#icon_input");
  icon_input.addEventListener("input", iconupdate, false);

}
function updateFirst(event) {
  const p = document.getElementById("background");
  const title = document.getElementById("title");
  const description = document.getElementById("description");
  const link = document.getElementById("link");
  const value = document.getElementById("value");
  const color = event.target.value
  if (value) {
    value.textContent = color;
  }
  const r = parseInt(color.substr(1,2), 16)
  const g = parseInt(color.substr(3,2), 16)
  const b = parseInt(color.substr(5,2), 16)
    luma = (0.212 * r + 0.701 * g + 0.087 * b) / 255
    if (luma > 0.5) {
      title.className="titl black"
      description.className="desc black"
      link.className="link black"
    } else {
      title.className="titl white"
      description.className="desc white"
      link.className="link white"
    }
  if (p) {
    p.style.backgroundColor = event.target.value;
  }
}
function updateAll(event) {
  document.querySelectorAll("p").forEach((p) => {
    p.style.color = event.target.value;
  });
}

function titleupdate(event) {
  const title = document.getElementById("title");
  title.textContent = event.target.value
}

function descriptionupdate(event) {
  const description = document.getElementById("description");
  description.textContent = event.target.value
}


function iconupdate(event) {
  const icon = document.getElementById("icon")
  if (event.target.value.startsWith("di")) {
    url="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/"
    icon.src=url.concat(event.target.value.substr(3), ".png")
  } else if (event.target.value.startsWith("http")) {
    icon.src=event.target.value
  } else {
    url="/static/"
    icon.src=url.concat(event.target.value)
  }
}

</script>

<section class="hero is-link is-fullheight">
  <div class="hero-body" style="background-image: url({{ config.appconfig.background_img }}) ;
        background-position: center center;
        background-repeat:  no-repeat;
        background-attachment: fixed;
        background-size:  cover;
        background-color: #999;">
  <a class="button" style="position: absolute; top: 00px; right: 0px;" href="{{ url_for('main.index') }}">
    <span class="icon is-small">
      <i class="bi bi-house-door-fill"></i>
    </span>
  </a>
  <div class="container">
    <div class="columns is-vcentered">
        <div class="column">
          <section class="item-container tag-0-dash">
                <div id="background" class="item" style="background-color: #161b1f">
                    <div class="app-icon-container">
                                                        <img id="icon" class="app-icon" src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/linux.png">
                                                    </div>
                    <div class="details">
                        <div id="title" class="titl white">ExampleTitle</div>
                        <div id="description" class="desc white">Example Description</div>
                    </div>
                    <a rel="noopener noreferrer" id="link" class="link white" target="_blank" href="https://localhost">
                      <svg class="svg-inline--fa fa-arrow-alt-to-right fa-w-14" aria-hidden="true" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                        <path fill="currentColor" d="M448 88v336c0 13.3-10.7 24-24 24h-24c-13.3 0-24-10.7-24-24V88c0-13.3 10.7-24 24-24h24c13.3 0 24 10.7 24 24zM24 320h136v87.7c0 17.8 21.5 26.7 34.1 14.1l152.2-152.2c7.5-7.5 7.5-19.8 0-27.3L194.1 90.1c-12.6-12.6-34.1-3.7-34.1 14.1V192H24c-13.3 0-24 10.7-24 24v80c0 13.3 10.7 24 24 24z">
                        </path>
                      </svg>
                    </a>
                </div>
          </section>
        </div>

        <div class="column is-two-thirds">
          <div class="box">
            <div class="field">
              <label class="label">Title</label>
              <div class="control">
                <input id="title_input" class="input" type="text" placeholder="ExampleTitle" value="ExampleTitle"/>
              </div>
              </div>
              <div class="field">
                <label class="label">Description</label>
                <div class="control">
                  <input id="description_input" class="input" type="text" placeholder="Example Description" />
                </div>
              </div>
              <div class="field">
                <label class="label">Icon src</label>
                <div class="control">
                  <input id="icon_input" class="input" type="text" placeholder="di-linux" />
                </div>
              </div>
              <label for="color-picker">Color:</label>
              <input type="color" value="#ff0000" id="color-picker" />
              Value: <span id="value">#FF0000</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
