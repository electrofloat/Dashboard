{% extends "base.html" %}
{% block content %}
<section class="hero is-link is-fullheight">
<div class="hero-body" style="background-image: url({{ config.appconfig.background_img }}) ;
        background-position: center center;
        background-repeat:  no-repeat;
        background-attachment: fixed;
        background-size:  cover;
        background-color: #003e70;">
{% if config.appconfig.show_settings %}
  <a class="button" style="position: absolute; top: 00px; right: 0px;" href="{{ url_for('main.route_color') }}">
    <span class="icon is-small">
      <i class="bi bi-gear"></i>
    </span>
  </a>
{% endif %}
  <div class="" style="width: 100%; display: flex; justify-content: center;">
    <div class="columns is-multiline is-centered is-gapless">
{% if config.tiles is not none %}
{% for tile in config.tiles %}
      <div class="column is-narrow">
        <section class="item-container tag-0-dash">
            <div class="item" style="background-color: {{tile.background_color}}">
                <div class="app-icon-container">
                  <img class="app-icon" src="{{ tile.icon }}">
                </div>
                <div class="details">
                    <div class="titl {{tile.foreground_color}}">{{tile.title}}</div>
                    <div class="desc {{tile.foreground_color}}">{{tile.description}}</div>
                </div>
                <a rel="noopener noreferrer" class="link {{tile.foreground_color}}" target="_blank" href="{{tile.url}}">
                  <svg class="svg-inline--fa fa-arrow-alt-to-right fa-w-14" aria-hidden="true" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                    <path fill="currentColor" d="M448 88v336c0 13.3-10.7 24-24 24h-24c-13.3 0-24-10.7-24-24V88c0-13.3 10.7-24 24-24h24c13.3 0 24 10.7 24 24zM24 320h136v87.7c0 17.8 21.5 26.7 34.1 14.1l152.2-152.2c7.5-7.5 7.5-19.8 0-27.3L194.1 90.1c-12.6-12.6-34.1-3.7-34.1 14.1V192H24c-13.3 0-24 10.7-24 24v80c0 13.3 10.7 24 24 24z">
                    </path>
                  </svg>
                </a>
            </div>
        </section>
      </div>
 {% endfor %}
 {% endif %}
    </div>
  </div>
</div>
</section>
{% endblock %}
