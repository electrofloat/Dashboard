      <div class="column is-narrow" data-search="{{ tile.title }} {{ tile.description }}">
        <section class="item-container tag-0-dash">
            <div class="item" style="background-color: {{tile.background_color}}">
                <div class="app-icon-container">
                  {% if tile.icon %}<img class="app-icon" src="{{ tile.icon|versioned }}" alt="">{% endif %}
                </div>
                <div class="details">
                    {% if path %}<div class="path {{tile.foreground_color}}">{{ path }}</div>{% endif %}
                    <div class="titl {{tile.foreground_color}}">{{tile.title}}</div>
                    <div class="desc {{tile.foreground_color}}">{{tile.description}}</div>
                </div>
                <a rel="noopener noreferrer" class="link {{tile.foreground_color}}" {% if tile.type == 'tile' %}target="_blank"{% endif %} href="{{tile.url}}" aria-label="{{tile.title}}">
                  <svg class="svg-inline--fa " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">{% if tile.type == 'folder' %}<path fill="currentColor" d="M88 289.6L64.4 360.2L64.4 160C64.4 124.7 93.1 96 128.4 96L267.1 96C280.9 96 294.4 100.5 305.5 108.8L343.9 137.6C349.4 141.8 356.2 144 363.1 144L480.4 144C515.7 144 544.4 172.7 544.4 208L544.4 224L179 224C137.7 224 101 250.4 87.9 289.6zM509.8 512L131 512C98.2 512 75.1 479.9 85.5 448.8L133.5 304.8C140 285.2 158.4 272 179 272L557.8 272C590.6 272 613.7 304.1 603.3 335.2L555.3 479.2C548.8 498.8 530.4 512 509.8 512z"/>{% else %}<path fill="currentColor" d="M448 88v336c0 13.3-10.7 24-24 24h-24c-13.3 0-24-10.7-24-24V88c0-13.3 10.7-24 24-24h24c13.3 0 24 10.7 24 24zM24 320h136v87.7c0 17.8 21.5 26.7 34.1 14.1l152.2-152.2c7.5-7.5 7.5-19.8 0-27.3L194.1 90.1c-12.6-12.6-34.1-3.7-34.1 14.1V192H24c-13.3 0-24 10.7-24 24v80c0 13.3 10.7 24 24 24z">
                    </path> {% endif %}</svg>
                </a>
            </div>
        </section>
      </div>
